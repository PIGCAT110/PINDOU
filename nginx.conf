# ============================================================
# PIGCAT 拼豆工坊 - Nginx 反向代理配置
# 使用前把 your-domain.com 替换为你的真实域名
# 部署位置（任选其一，按你的系统）：
#   Ubuntu/Debian (apt 安装)：/etc/nginx/sites-available/pigcat.conf  → ln -s 到 sites-enabled/
#   或单机配置：/etc/nginx/conf.d/pigcat.conf
# 改完后执行：nginx -t 测试 → systemctl reload nginx 生效
# ============================================================

# ---------- 上游 Node 服务 ----------
upstream pigcat_backend {
    # Node 服务监听端口，与 server.js 的 PORT 一致（默认 3000）
    # 若用 PM2 守护多实例，可在此加多行做负载均衡
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- HTTP → HTTPS 强制跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 自动发货接口若用 GET 方式调用，也走 HTTPS（更安全）
    return 301 https://$host$request_uri;
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # === SSL 证书（Let's Encrypt / certbot 申请后填这两行）===
    # 首次没有证书时，先用 certbot --nginx -d your-domain.com 自动申请并注入
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # === SSL 安全设置 ===
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 通用安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # 请求体上限：图纸生成会上传较大图片，给足 50m（与 server.js 的 json limit 对齐）
    client_max_body_size 50m;

    # === 反向代理到 Node ===
    location / {
        proxy_pass http://pigcat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 让 Node 知道原始是 http 还是 https
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;     # AI 生图可能耗时较长，放宽到 5 分钟
        proxy_read_timeout 300s;
        proxy_buffering off;         # 流式响应/长连接更顺畅
    }

    # === 静态资源缓存（HTML 页面不缓存，避免改版后浏览器用旧文件）===
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://pigcat_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # === Gzip 压缩 ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
